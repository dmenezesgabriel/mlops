services:
  moto:
    # Manifest-list digests (ADR-0014 §1); Dependabot's docker-compose
    # ecosystem bumps them.
    image: motoserver/moto:5.2.4@sha256:120b1589c6df7e35d2092935f6ff724486bb2c4189d0e36ce795baba1400ffd2
    # The Glue overlay (docker/moto/) adds the column-statistics and
    # user-defined-function operations the Trino hive connector needs
    # (docker/moto/glue_overlay.py). The official image stays unchanged; the
    # entrypoint applies the overlay at startup.
    volumes:
      - ./docker/moto:/docker/moto:ro
    entrypoint: ["/bin/sh", "/docker/moto/entrypoint.sh"]
    command: -H 0.0.0.0
    # Idle at 59 MiB measured 2026-10-21; 512m matches the project stacks and
    # keeps a runaway S3/Glue process off the shared host.
    deploy:
      resources:
        limits:
          memory: 512m
    ports:
      - "5000:5000"
    # TCP-connect check, not urlopen: moto answers several paths with non-2xx
    # even when healthy, and `compose up --wait` only gates on declared checks.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 5000), 3).close()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - mlops_net

  trino:
    image: trinodb/trino:484@sha256:2704eb53935af5e582d63d6033e9bf99d20c325e9b0e30b1016ef59a4773979f
    # File mounts only: the image's /etc/trino also carries node.properties,
    # jvm.config and log.properties, which a directory mount would hide. The
    # catalog mount intentionally replaces the sample catalogs (tpch et al.)
    # with the repo's hive catalog (docker/trino/).
    volumes:
      - ./docker/trino/config.properties:/etc/trino/config.properties:ro
      - ./docker/trino/catalog:/etc/trino/catalog:ro
    # Host publish sits on 8485, not trino's canonical 8080: sagemaker-local
    # serve containers publish `serving_port:8080` (SDK host_config, default
    # 8080 in libs/sagemaker-local/src/sagemaker_local/config.py) and the same
    # value is the client URL port, so it cannot move — trino's publish must.
    # `TRINO_PORT=8080 docker compose up` restores the old bind when no
    # sagemaker-local notebooks run. In-stack consumers use trino:8080 anyway.
    ports:
      - "${TRINO_PORT:-8485}:8080"
    # The image jvm.config sizes heap at 80% of *visible* RAM; without a
    # container limit that is the host's 30 GiB. A 4 GiB cap keeps the
    # emulator workload inside this host's budget (heap lands at ~3.2 GiB).
    deploy:
      resources:
        limits:
          memory: 4g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      - moto
    networks:
      - mlops_net

  athena:
    build:
      context: .
      dockerfile: docker/athena/Dockerfile
    image: athena-local
    ports:
      - "5001:5001"
    environment:
      ATHENA_LOCAL_TRINO_URL: "http://trino:8080"
      ATHENA_MOTO_ENDPOINT_URL: "http://moto:5000"
    # Idle at 126 MiB measured 2026-10-21; Trino pages are parsed one page at a
    # time, so 512m covers the query plane.
    deploy:
      resources:
        limits:
          memory: 512m
    # Slim image has no curl; the interpreter check mirrors the image's
    # HEALTHCHECK so `depends_on: athena: service_healthy` works for compose
    # consumers (jupyterlab) even if the image check changes.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      moto:
        condition: service_started
      trino:
        condition: service_healthy
    networks:
      - mlops_net

  jupyterlab:
    build:
      context: .
      args:
        GIT_REVISION: "${GIT_REVISION:-unknown}"
    image: mlops-jupyterlab
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - "${DOCKER_GID:-973}"
    ports:
      - "8888:8888"
    volumes:
      - "${PWD}:${PWD}"
      - /tmp:/tmp
      - /var/run/docker.sock:/var/run/docker.sock
      - jupyterlab-venv:/opt/jupyterlab
      - mlops-venv:/opt/mlops-venv
      - jupyter-config:/home/jupyter/.config/jupyter
      - jupyter-data:/home/jupyter/.local/share/jupyter
      - uv-data:/home/jupyter/.local/share/uv
      - uv-cache:/tmp/uv-cache
      # sklearn's fetch_california_housing caches under ~/scikit_learn_data —
      # container-local, so a recreated jupyterlab re-downloads (or fails
      # offline). The vendored pkz (produced by the images' sklearn 1.6.1)
      # seeds it read-only; the dir stays writable for other fetch_* datasets.
      - ./docker/scikit_learn_data/cal_housing_py3.pkz:/home/jupyter/scikit_learn_data/cal_housing_py3.pkz:ro
    environment:
      JUPYTER_TOKEN: ""
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_ENDPOINT_URL: "http://moto:5000"
      # Per-service endpoint wins over the global one for Athena only, so
      # S3/Glue stay on moto while Athena traffic hits the emulator (ADR-0002).
      AWS_ENDPOINT_URL_ATHENA: "http://athena:5001"
      SAGEMAKER_LOCAL_REPO_PATH: "${PWD}"
      SAGEMAKER_LOCAL_S3_ENDPOINT_URL: "http://moto:5000"
      SAGEMAKER_LOCAL_BUCKET: "sagemaker-local"
      SAGEMAKER_LOCAL_NETWORK: "mlops_net"
      SAGEMAKER_LOCAL_IMAGE_TAG: "sagemaker-local:latest"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GH_TOKEN: "${GH_TOKEN:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    # Runs the full test suite and every notebook. Measured peak 597 MiB on a
    # 1M-row pandas/sklearn fit (2026-10-21); 4 GiB leaves headroom for the
    # suite without letting a runaway kernel reach the host.
    deploy:
      resources:
        limits:
          memory: 4g
    # Consumers inside jupyterlab hit the emulator and moto at boot, so a cold
    # `docker compose up` sequences behind a healthy athena.
    depends_on:
      athena:
        condition: service_healthy
      moto:
        condition: service_started
    networks:
      - mlops_net

networks:
  mlops_net:
    name: mlops_net
    external: true

volumes:
  jupyterlab-venv:
  mlops-venv:
  jupyter-config:
  jupyter-data:
  uv-data:
  uv-cache:
