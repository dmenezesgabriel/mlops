services:
  moto:
    image: motoserver/moto:5.1.16
    # The Glue overlay (docker/moto/) adds the column-statistics and
    # user-defined-function operations the Trino hive connector needs
    # (docker/moto/glue_overlay.py). The official image stays unchanged; the
    # entrypoint applies the overlay at startup.
    volumes:
      - ./docker/moto:/docker/moto:ro
    entrypoint: ["/bin/sh", "/docker/moto/entrypoint.sh"]
    command: -H 0.0.0.0
    ports:
      - "5000:5000"
    networks:
      - mlops_net

  trino:
    image: trinodb/trino:483
    # File mounts only: the image's /etc/trino also carries node.properties,
    # jvm.config and log.properties, which a directory mount would hide. The
    # catalog mount intentionally replaces the sample catalogs (tpch et al.)
    # with the repo's hive catalog (docker/trino/).
    volumes:
      - ./docker/trino/config.properties:/etc/trino/config.properties:ro
      - ./docker/trino/catalog:/etc/trino/catalog:ro
    ports:
      - "8080:8080"
    # The image jvm.config sizes heap at 80% of *visible* RAM; without a
    # container limit that is the host's 30 GiB. A 4 GiB cap keeps the
    # emulator workload inside this host's budget (heap lands at ~3.2 GiB).
    deploy:
      resources:
        limits:
          memory: 4g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      - moto
    networks:
      - mlops_net

  athena:
    build:
      context: .
      dockerfile: docker/athena/Dockerfile
    image: athena-local
    ports:
      - "5001:5001"
    environment:
      ATHENA_LOCAL_TRINO_URL: "http://trino:8080"
      ATHENA_MOTO_ENDPOINT_URL: "http://moto:5000"
    depends_on:
      moto:
        condition: service_started
      trino:
        condition: service_healthy
    networks:
      - mlops_net

  jupyterlab:
    build: .
    image: mlops-jupyterlab
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - "${DOCKER_GID:-973}"
    ports:
      - "8888:8888"
    volumes:
      - "${PWD}:${PWD}"
      - /tmp:/tmp
      - /var/run/docker.sock:/var/run/docker.sock
      - jupyterlab-venv:/opt/jupyterlab
      - mlops-venv:/opt/mlops-venv
      - jupyter-config:/home/jupyter/.config/jupyter
      - jupyter-data:/home/jupyter/.local/share/jupyter
      - uv-data:/home/jupyter/.local/share/uv
      - uv-cache:/tmp/uv-cache
    environment:
      JUPYTER_TOKEN: ""
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_ENDPOINT_URL: "http://moto:5000"
      # Per-service endpoint wins over the global one for Athena only, so
      # S3/Glue stay on moto while Athena traffic hits the emulator (ADR-0002).
      AWS_ENDPOINT_URL_ATHENA: "http://athena:5001"
      SAGEMAKER_LOCAL_REPO_PATH: "${PWD}"
      SAGEMAKER_LOCAL_S3_ENDPOINT_URL: "http://moto:5000"
      SAGEMAKER_LOCAL_BUCKET: "sagemaker-local"
      SAGEMAKER_LOCAL_NETWORK: "mlops_net"
      SAGEMAKER_LOCAL_IMAGE_TAG: "sagemaker-local:latest"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GH_TOKEN: "${GH_TOKEN:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    networks:
      - mlops_net

networks:
  mlops_net:
    name: mlops_net
    external: true

volumes:
  jupyterlab-venv:
  mlops-venv:
  jupyter-config:
  jupyter-data:
  uv-data:
  uv-cache:
