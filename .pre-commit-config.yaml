repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff-format
        exclude: ^libs/data-science-scaffold/template/
      - id: ruff
        args: [--fix]
        exclude: ^libs/data-science-scaffold/template/
  - repo: local
    hooks:
      - id: bandit
        name: bandit security scan
        entry: uv run bandit -q -r libs/athena-local/src -ll
        language: system
        pass_filenames: false
        files: ^libs/athena-local/
      - id: vulture
        name: vulture dead code check
        entry: uv run vulture --min-confidence 80 libs/athena-local/src
        language: system
        pass_filenames: false
        files: ^libs/athena-local/
      - id: xenon
        name: xenon maintainability check
        entry: uv run xenon --max-absolute B --max-modules A --max-average A libs/athena-local/src
        language: system
        pass_filenames: false
        files: ^libs/athena-local/
      - id: deptry
        name: deptry
        entry: make dependencies
        language: system
        pass_filenames: false
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
      - id: radon
        name: radon complexity
        entry: make complexity
        language: system
        pass_filenames: false
