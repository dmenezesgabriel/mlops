repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff-format
        exclude: ^libs/data-science-scaffold/template/
      - id: ruff
        args: [--fix]
        exclude: ^libs/data-science-scaffold/template/
  - repo: local
    hooks:
      - id: security
        name: package security scans (bandit, vulture, semgrep)
        entry: make security
        language: system
        pass_filenames: false
      - id: maintainability
        name: xenon maintainability
        entry: make maintainability
        language: system
        pass_filenames: false
      - id: deptry
        name: deptry
        entry: make dependencies
        language: system
        pass_filenames: false
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
      - id: radon
        name: radon complexity
        entry: make complexity
        language: system
        pass_filenames: false
