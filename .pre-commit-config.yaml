repos:
  # ShellCheck's own hook (koalaman/shellcheck README): the pinned upstream image, run offline
  # by pre-commit over every file it identifies as shell, by extension or shebang.
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        # docker/.zshrc is zsh, which ShellCheck does not support (SC2148).
        exclude: ^docker/\.zshrc$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff-format
        exclude: ^libs/data-science-scaffold/template/|\.sh$
      - id: ruff
        args: [--fix]
        exclude: ^libs/data-science-scaffold/template/|\.sh$
  - repo: local
    hooks:
      - id: security
        name: package security scans (bandit, vulture, semgrep) — changed packages
        entry: scripts/gate-changed.sh security
        language: system
        pass_filenames: true
      - id: maintainability
        name: xenon maintainability — changed packages
        entry: scripts/gate-changed.sh maintainability
        language: system
        pass_filenames: true
      - id: deptry
        name: deptry — changed packages
        entry: scripts/gate-changed.sh dependencies
        language: system
        pass_filenames: true
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
      - id: radon
        name: radon complexity — changed packages
        entry: scripts/gate-changed.sh complexity
        language: system
        pass_filenames: true
