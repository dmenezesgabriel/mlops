# Project-local AWS emulator; namespaced so it can coexist with the other
# project stacks on mlops_net.
services:
  moto:
    image: motoserver/moto:5.2.4@sha256:120b1589c6df7e35d2092935f6ff724486bb2c4189d0e36ce795baba1400ffd2
    container_name: wine-quality-classification-moto
    command: ["-p", "5000", "-H", "0.0.0.0"]
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [mlops_net]

networks:
  mlops_net:
    external: true
