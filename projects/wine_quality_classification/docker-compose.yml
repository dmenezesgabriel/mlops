# Project-local AWS emulator; namespaced so it can coexist with the other
# project stacks on mlops_net.
services:
  moto:
    image: motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
    container_name: wine-quality-classification-moto
    command: ["-p", "5000", "-H", "0.0.0.0"]
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [mlops_net]

networks:
  mlops_net:
    external: true
