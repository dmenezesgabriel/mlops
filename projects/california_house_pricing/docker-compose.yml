# Project-local AWS emulator. The container name and bucket are namespaced so
# this stack can coexist with the root moto and the other project stacks on
# mlops_net without DNS or bucket collisions. Feast's DynamoDB online store
# talks to this same moto endpoint via online_store.endpoint_url.
services:
  moto:
    image: motoserver/moto:5.1.16@sha256:f78c8e0370cabe2516395f351fb27e1df1aa6dc2d728d6de16d5dfbc9ccf595d
    container_name: california-house-pricing-moto
    command: ["-p", "5000", "-H", "0.0.0.0"]
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [mlops_net]

networks:
  mlops_net:
    external: true
