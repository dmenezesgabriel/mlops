[project]
name = "sagemaker-scikit-learn"
version = "0.1.0"
description = "Offline SageMaker local mode example using scikit-learn."
requires-python = ">=3.11"
dependencies = [
  "sagemaker-local",
]

[project.optional-dependencies]
notebooks = [
  "ipykernel>=7.1.0",
  "nbclient>=0.11.0",
  "nbconvert>=7.17.1",
]

[tool.uv.sources]
sagemaker-local = { workspace = true }

[tool.deptry.package_module_name_map]
sagemaker-scikit-learn = "sagemaker_scikit_learn"

[tool.deptry.per_rule_ignores]
# sklearn / joblib are imported by train.py, which runs only inside
# sagemaker-local:latest (installed in that image, not the workspace).
DEP001 = ["sklearn", "joblib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra --tb=short --import-mode=importlib"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingParameterType = true
reportMissingReturnType = true
reportUnnecessaryCast = true
reportUnusedIgnoreComment = true
reportMissingImports = false
# sklearn loader returns are typed as loose unions; .data/.target can't be
# narrowed in the example train.py. Frameworks load inside the image, not here.
reportAttributeAccessIssue = false

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
