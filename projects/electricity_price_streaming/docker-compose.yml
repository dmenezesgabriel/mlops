# Streaming stack: moto (S3 + DynamoDB for Feast online) + Kafka in KRaft
# mode (no zookeeper) + a Flink jobmanager/taskmanager pair that runs the
# PyFlink scoring job. All namespaced so it coexists with sibling stacks on
# mlops_net.
#
# Every service is memory-capped. The three JVMs (Kafka, both Flink roles)
# otherwise size their heap from *host* RAM, so on a shared host an idle demo
# stack can commit gigabytes it never uses. Each cap is sized to the heap
# pinned just above it, not to the host.
services:
  moto:
    image: motoserver/moto:5.1.16@sha256:f78c8e0370cabe2516395f351fb27e1df1aa6dc2d728d6de16d5dfbc9ccf595d
    container_name: electricity-price-streaming-moto
    command: ["-p", "5000", "-H", "0.0.0.0"]
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [mlops_net]

  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    container_name: electricity-price-streaming-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # One broker for a demo topic set: pin the heap instead of letting the
      # image default to a share of host RAM.
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [mlops_net]

  flink-jobmanager:
    image: flink:1.20-scala_2.12-java11@sha256:671e890a10e783374d626a6870756c6ad86983e8f94e8a21b6d1408a1f86be2c
    container_name: electricity-price-streaming-flink-jm
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 1
        jobmanager.memory.process.size: 768m
    deploy:
      resources:
        limits:
          memory: 1g
    volumes:
      - ./flink_job:/opt/flink_job
    networks: [mlops_net]

  flink-taskmanager:
    image: flink:1.20-scala_2.12-java11@sha256:671e890a10e783374d626a6870756c6ad86983e8f94e8a21b6d1408a1f86be2c
    container_name: electricity-price-streaming-flink-tm
    command: taskmanager
    depends_on: [flink-jobmanager]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1280m
    deploy:
      resources:
        limits:
          memory: 1536m
    volumes:
      - ./flink_job:/opt/flink_job
    networks: [mlops_net]

networks:
  mlops_net:
    external: true
