# Streaming stack: moto (S3 + DynamoDB for Feast online) + Kafka in KRaft
# mode (no zookeeper) + a Flink jobmanager/taskmanager pair built from
# ./docker/flink: the stock Flink image ships no Python, so the mounted
# PyFlink job cannot run there. All namespaced so it coexists with sibling
# stacks on mlops_net.
#
# Every service is memory-capped. The three JVMs (Kafka, both Flink roles)
# otherwise size their heap from *host* RAM, so on a shared host an idle demo
# stack can commit gigabytes it never uses. Each JVM cap is sized to the
# process size pinned just above it, not to the host; the Flink caps also
# carry the PyFlink workers that run beside each JVM.
services:
  moto:
    image: motoserver/moto:5.1.16@sha256:f78c8e0370cabe2516395f351fb27e1df1aa6dc2d728d6de16d5dfbc9ccf595d
    container_name: electricity-price-streaming-moto
    command: ["-p", "5000", "-H", "0.0.0.0"]
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [mlops_net]

  kafka:
    image: apache/kafka:3.8.0@sha256:c89f315cff967322c5d2021434b32271393cb193aa7ec1d43e97341924e57069
    container_name: electricity-price-streaming-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # One broker for a demo topic set: pin the heap instead of letting the
      # image default to a share of host RAM.
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [mlops_net]

  flink-jobmanager:
    build:
      context: ./docker/flink
      args:
        GIT_REVISION: "${GIT_REVISION:-unknown}"
    image: electricity-price-streaming:flink
    container_name: electricity-price-streaming-flink-jm
    command: jobmanager
    environment:
      SAGEMAKER_ENDPOINT_URL: "${SAGEMAKER_ENDPOINT_URL:-}"
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 1
        jobmanager.memory.process.size: 768m
    deploy:
      resources:
        limits:
          memory: 1g
    volumes:
      - ./flink_job:/opt/flink_job
    networks: [mlops_net]

  flink-taskmanager:
    build:
      context: ./docker/flink
      args:
        GIT_REVISION: "${GIT_REVISION:-unknown}"
    image: electricity-price-streaming:flink
    container_name: electricity-price-streaming-flink-tm
    command: taskmanager
    depends_on: [flink-jobmanager]
    environment:
      SAGEMAKER_ENDPOINT_URL: "${SAGEMAKER_ENDPOINT_URL:-}"
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1280m
    deploy:
      resources:
        limits:
          memory: 1536m
    volumes:
      - ./flink_job:/opt/flink_job
    networks: [mlops_net]

networks:
  mlops_net:
    external: true
