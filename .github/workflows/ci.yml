name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-site-inputs:
    name: Detect Site-Affecting Changes
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.detect.outputs.site }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: scripts/detect-site-inputs.sh "$EVENT_NAME" "$BEFORE" "$BASE_REF"

  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen --extra transformers --extra evaluation

      - name: Lint
        run: make lint

      - name: Type check
        run: make type-check

      # athena-local's contract suites mark Go and terraform required below;
      # Go rides the runner image, terraform does not — provision it or
      # ATHENA_TERRAFORM_REQUIRED turns a skip into a failure.
      - name: Set up terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_wrapper: false

      # athena-local's integration suite skips when the compose stack is down;
      # a bring-up failure fails this job before the skips can hide it.
      - name: Start compose stack
        run: |
          docker network inspect mlops_net >/dev/null 2>&1 || docker network create mlops_net
          docker compose up -d --wait --build moto trino athena

      - name: Test
        run: make test
        env:
          ATHENA_LOCAL_TRINO_URL: http://localhost:8485
          ATHENA_LOCAL_MOTO_ENDPOINT_URL: http://127.0.0.1:5000
          ATHENA_LOCAL_TEST_ENDPOINT: http://localhost:5001
          ATHENA_GO_REQUIRED: "1"
          ATHENA_TERRAFORM_REQUIRED: "1"

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --tail 200 moto trino athena

      - name: Stop compose stack
        if: always()
        run: docker compose down

      - name: Complexity
        run: make complexity

      - name: Dependency checks
        run: make dependencies

      - name: Architecture checks
        run: make architecture

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen --extra transformers --extra evaluation

      - name: Run Semgrep
        run: make security

  build-site:
    name: Build Site
    runs-on: ubuntu-latest
    needs: detect-site-inputs
    # The site build is the expensive path (diagrams image, MarianMT
    # translation, browser smoke downstream); when detect-site-inputs
    # proves no changed file can reach site/build, this skips entirely.
    if: needs.detect-site-inputs.outputs.site == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen --extra transformers --extra evaluation

      # ssg-mermaid's build-time renderer runs node against vendored
      # jsdom@30/svgdom — package-lock engines floor is node >=22.22.2,
      # and `npm ci` only warns on EBADENGINE, so an older runner-default
      # node would fail inside the render subprocess rather than at setup.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Correctness lives in each generated file's .translate-fingerprint
      # sidecar (catalog + source sha256 + translator code), not in this
      # key — a stale restore can only re-translate, never serve old
      # output. The sha key rolls a fresh entry per run while restore-keys
      # picks the most recent prior one.
      - name: Restore generated i18n content
        uses: actions/cache@v4
        with:
          path: site/.ssg
          key: ssg-generated-${{ github.sha }}
          restore-keys: ssg-generated-

      - name: Restore vendored Node dependencies
        uses: actions/cache@v4
        with:
          path: |
            libs/ssg-mermaid/src/ssg_mermaid/node_modules
            libs/ssg-latex/src/ssg_latex/node_modules
          key: ssg-node-${{ hashFiles('libs/ssg-mermaid/src/ssg_mermaid/package-lock.json', 'libs/ssg-latex/src/ssg_latex/package-lock.json') }}

      - name: Restore Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('uv.lock') }}
          restore-keys: hf-models-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build diagrams image
        uses: docker/build-push-action@v7
        with:
          context: libs/diagrams
          file: libs/diagrams/Dockerfile
          tags: mlops-diagrams-prod
          build-args: GIT_REVISION=${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render diagrams
        run: make diagrams-render

      - name: Build configured site
        run: make build-site

      - name: Evaluate translations
        run: make evaluate-translation

      - name: Verify site files
        run: |
          test -f site/build/index.html
          test -f site/build/404.html
          test -f site/build/versions.json
          test -f site/build/latest/assets/site.css
          test -f site/build/latest/assets/site.js
          test -f site/build/latest/pt-BR/index.html
          test -f site/build/latest/nyc-taxi-demand-forecasting/overview.html

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: built-site
          path: site/build
          if-no-files-found: error

  site-smoke:
    name: Site Browser Smoke Test
    runs-on: ubuntu-latest
    needs: build-site
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen --extra transformers --extra evaluation

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: built-site
          path: site/build

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run site smoke test
        run: make test-e2e
