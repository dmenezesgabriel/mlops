name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  detect-site-inputs:
    name: Detect Site-Affecting Changes
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.detect.outputs.site }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: scripts/detect-site-inputs.sh "$EVENT_NAME" "$BEFORE" "$BASE_REF"

  build:
    name: Build Pages Artifact
    runs-on: ubuntu-latest
    needs: detect-site-inputs
    # Publishing stays conservative: site=false only when every changed
    # path is proven site-inert, so an unrelated push never redeploys and
    # a questionable one always does.
    if: needs.detect-site-inputs.outputs.site == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen --extra transformers --extra evaluation

      - name: Lint
        run: make lint

      - name: Type check
        run: make type-check

      - name: Test
        run: make test

      - name: Dependency checks
        run: make dependencies

      # ssg-mermaid's build-time renderer runs node against vendored
      # jsdom@30/svgdom — package-lock engines floor is node >=22.22.2,
      # and `npm ci` only warns on EBADENGINE, so an older runner-default
      # node would fail inside the render subprocess rather than at setup.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Correctness lives in each generated file's .translate-fingerprint
      # sidecar (catalog + source sha256 + translator code), not in this
      # key — a stale restore can only re-translate, never serve old
      # output. The sha key rolls a fresh entry per run while restore-keys
      # picks the most recent prior one.
      - name: Restore generated i18n content
        uses: actions/cache@v4
        with:
          path: site/.ssg
          key: ssg-generated-${{ github.sha }}
          restore-keys: ssg-generated-

      - name: Restore vendored Node dependencies
        uses: actions/cache@v4
        with:
          path: |
            libs/ssg-mermaid/src/ssg_mermaid/node_modules
            libs/ssg-latex/src/ssg_latex/node_modules
          key: ssg-node-${{ hashFiles('libs/ssg-mermaid/src/ssg_mermaid/package-lock.json', 'libs/ssg-latex/src/ssg_latex/package-lock.json') }}

      - name: Restore Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('uv.lock') }}
          restore-keys: hf-models-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build diagrams image
        uses: docker/build-push-action@v7
        with:
          context: libs/diagrams
          file: libs/diagrams/Dockerfile
          tags: mlops-diagrams-prod
          build-args: GIT_REVISION=${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render diagrams
        run: make diagrams-render

      - name: Build configured site
        run: make build-site

      - name: Prepare Pages artifact
        run: touch site/build/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/build

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
