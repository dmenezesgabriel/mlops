version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /
      - /docker/athena
      - /libs/diagrams
      - /libs/sagemaker-local/docker
      - /libs/videos
      - /projects/*
      - /termux
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker-compose
    directories:
      - /
      - /projects/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
