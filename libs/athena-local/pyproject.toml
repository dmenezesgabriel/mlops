[project]
name = "athena-local"
version = "0.1.0"
description = "Local AWS Athena emulator backed by Apache Trino and moto (S3/Glue) with JSON-1.1 protocol parity for boto3, awswrangler, AWS CLI, and terraform-provider-aws."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "botocore==1.42.97",
  "fastapi==0.136.3",
]

[dependency-groups]
dev = [
  "boto3==1.42.82",
  "httpx==0.28.1",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "uvicorn==0.34.0",
]

[tool.deptry]
known_first_party = ["athena_local"]

[tool.deptry.package_module_name_map]
athena-local = "athena_local"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athena_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra --tb=short --import-mode=importlib"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingParameterType = true
reportMissingReturnType = true
reportUnnecessaryCast = true
reportUnusedIgnoreComment = true
reportMissingImports = false