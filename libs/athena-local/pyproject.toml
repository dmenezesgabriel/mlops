[project]
name = "athena-local"
version = "0.1.0"
description = "Local AWS Athena emulator backed by Apache Trino and moto (S3/Glue) with JSON-1.1 protocol parity for boto3, awswrangler, AWS CLI, and terraform-provider-aws."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "botocore==1.42.97",
  "fastapi==0.136.3",
  "httpx==0.28.1",
  "uvicorn==0.34.0",
]

[dependency-groups]
dev = [
  "awscli==1.46.1",
  "awswrangler==3.17.1",
  "boto3==1.42.82",
  "moto[server]==5.1.16",
  "pandas==2.3.3",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
]

[tool.deptry]
known_first_party = ["athena_local"]
# uvicorn is invoked as the image entrypoint, not imported by Python source.
per_rule_ignores = {DEP002 = ["uvicorn"]}

[tool.deptry.package_module_name_map]
athena-local = "athena_local"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athena_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rfEs --tb=short --show-capture=no --import-mode=importlib"
console_output_style = "classic"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingParameterType = true
reportMissingReturnType = true
reportUnnecessaryCast = true
reportUnusedIgnoreComment = true
reportMissingImports = false

[tool.vulture]
min_confidence = 80
# CatalogClient (glue_proxy.py) and ObjectStoreClient (s3_writer.py) mirror the
# botocore client keyword names exactly so pyright checks call sites; protocol
# stubs never reference them.
ignore_names = ["implemented_operations", "test_*", "*_test", "*kwargs", "__*__", "Name", "DatabaseName", "Expression", "Bucket", "Key", "Body", "Prefix", "ContinuationToken"]
sort_by_size = true
