[project]
name = "ssg-i18n-machine-translation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "ssg-i18n",
  "mistletoe>=1.3.0",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
transformers = [
  "transformers>=4.38.0,<5",
  "torch>=2.0.0",
  "sentencepiece>=0.2.0",
]
evaluation = [
  "sacrebleu>=2.6.0",
]

[project.scripts]
ssg-i18n-evaluate = "ssg_i18n_machine_translation.infrastructure.cli:main"

[project.entry-points."ssg_i18n.text_translators"]
transformers = "ssg_i18n_machine_translation.infrastructure.plugin:create_transformers_text_translator"

[tool.uv.sources]
ssg-i18n = { workspace = true }

[tool.coverage.run]
# bare `--cov` traces the editable `ssg_i18n` workspace dependency; those
# modules are covered by ssg-i18n's own suite, so measure only this
# package's code.
source = ["src", "tests"]

[tool.deptry.package_module_name_map]
ssg-i18n = "ssg_i18n"
ssg-i18n-machine-translation = "ssg_i18n_machine_translation"

[tool.deptry.per_rule_ignores]
DEP002 = ["transformers", "torch", "sentencepiece", "sacrebleu"]
DEP003 = ["ssg_i18n_machine_translation"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rfEs --tb=short --show-capture=no --import-mode=importlib"
console_output_style = "classic"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingParameterType = true
reportMissingReturnType = true
reportUnnecessaryCast = true
reportUnusedIgnoreComment = true
reportMissingImports = false

[tool.vulture]
min_confidence = 80
# TransformersModule.pipeline (transformers_text_translator.py) is a Protocol
# stub whose task/model names mirror transformers.pipeline kwargs; the `...`
# body never references them.
ignore_names = ["task", "model"]
sort_by_size = true
