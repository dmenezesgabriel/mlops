[project]
name = "videos"
version = "0.1.0"
description = "Deterministic Python-first ManimCE video production engine for educational ML content"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
manim = ["manim"]
concepts = [
    "pyyaml>=6.0",
]

[project.scripts]
videos = "videos.infrastructure.cli:main"

[tool.deptry]
known_first_party = ["videos"]
package_module_name_map = {videos = "videos"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rfEs --tb=short --show-capture=no --import-mode=importlib"
console_output_style = "classic"
markers = [
    "docker: tests that require Docker with Manim to render scenes",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingParameterType = true
reportMissingReturnType = true
reportUnnecessaryCast = true
reportUnusedIgnoreComment = true
reportMissingImports = false

[tool.vulture]
min_confidence = 80
# LinterPort.verify_video (ports/linter.py) and its implementation keep the
# video_path param name from the interface contract; stub bodies ignore it.
ignore_names = ["video_path"]
sort_by_size = true
