[project]
name = "sagemaker-local"
version = "0.1.0"
description = "Run Amazon SageMaker Python SDK local mode fully offline against moto, with docker-network aware patching."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3==1.42.82",
  "botocore==1.42.97",
  "pyyaml==6.0.3",
  "sagemaker==2.257.1",
]

[dependency-groups]
dev = [
  # joblib is imported by docker/serve_app.py, which the fallback tests load;
  # the container runtime pins its own copy in docker/Dockerfile.
  "joblib==1.4.2",
  "moto[server]==5.1.16",
]

[tool.coverage.run]
# Pin measurement to this package's own code — including docker/, which holds
# the image-runtime module the security gate already scans — so serve_app's
# request path stays coverage-visible instead of silently unscanned.
source = ["src", "tests", "docker"]

[tool.deptry]
known_first_party = ["sagemaker_local"]
# docker/serve_app.py is the SageMaker hosting runtime baked into the image;
# its imports are pinned inside docker/Dockerfile, not declared by the lib.
extend_exclude = ["docker"]

[tool.deptry.package_module_name_map]
sagemaker-local = "sagemaker_local"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sagemaker_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rfEs --tb=short --show-capture=no --import-mode=importlib"
console_output_style = "classic"
markers = [
    "integration: round-trips against an in-process moto server (no docker needed)",
    "docker: requires the docker daemon (image build/inspect)",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingParameterType = true
reportMissingReturnType = true
reportUnnecessaryCast = true
reportUnusedIgnoreComment = true
reportMissingImports = false

[tool.vulture]
min_confidence = 80
sort_by_size = true
