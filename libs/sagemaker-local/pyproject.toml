[project]
name = "sagemaker-local"
version = "0.1.0"
description = "Run Amazon SageMaker Python SDK local mode fully offline against moto, with docker-network aware patching."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3==1.42.82",
  "pyyaml==6.0.3",
  "sagemaker==2.257.1",
]

[project.optional-dependencies]
test = [
  "moto[server]==5.1.16",
]

[tool.deptry.package_module_name_map]
sagemaker-local = "sagemaker_local"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sagemaker_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rfEs --tb=short --show-capture=no --import-mode=importlib"
console_output_style = "classic"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingParameterType = true
reportMissingReturnType = true
reportUnnecessaryCast = true
reportUnusedIgnoreComment = true
reportMissingImports = false

[tool.vulture]
min_confidence = 80
# Test fixtures used for side effects (compose_project materializes a patched
# compose file, fake_host_env fakes container env) — the param name must match
# the fixture name, so the test body never references it.
ignore_names = ["compose_project", "fake_host_env", "detached"]
sort_by_size = true
