[project]
name = "sagemaker-local"
version = "0.1.0"
description = "Run Amazon SageMaker Python SDK local mode fully offline against moto, with docker-network aware patching."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3==1.42.82",
  "pyyaml==6.0.3",
  "sagemaker==2.257.1",
]

[project.optional-dependencies]
test = [
  "moto[server]==5.1.16",
]

[tool.deptry.package_module_name_map]
sagemaker-local = "sagemaker_local"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sagemaker_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra --tb=short --import-mode=importlib"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingParameterType = true
reportMissingReturnType = true
reportUnnecessaryCast = true
reportUnusedIgnoreComment = true
reportMissingImports = false
