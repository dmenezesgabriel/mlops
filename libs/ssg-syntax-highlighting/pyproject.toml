[project]
name = "ssg-syntax-highlighting"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pygments==2.20.0",
  "ssg",
]

[project.entry-points."ssg.html_post_processors"]
pygments = "ssg_syntax_highlighting.infrastructure.plugin:create_pygments_html_post_processor"

[tool.uv.sources]
ssg = { workspace = true }

[tool.coverage.run]
# bare `--cov` traces the editable `ssg` workspace dependency; those modules
# are covered by ssg's own suite, so measure only this package's code.
source = ["src", "tests"]

[tool.deptry.package_module_name_map]
ssg = "ssg"
ssg-syntax-highlighting = "ssg_syntax_highlighting"

[tool.deptry.per_rule_ignores]
DEP003 = ["ssg_syntax_highlighting"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rfEs --tb=short --show-capture=no --import-mode=importlib"
console_output_style = "classic"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingParameterType = true
reportMissingReturnType = true
reportUnnecessaryCast = true
reportUnusedIgnoreComment = true
reportMissingImports = false
