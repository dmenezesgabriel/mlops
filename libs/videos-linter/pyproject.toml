[project]
name = "videos-linter"
version = "0.1.0"
description = "Advanced image and video linter plugin for the videos production engine"
requires-python = ">=3.11"
dependencies = [
    "videos",
    "numpy",
    "opencv-python",
]

[dependency-groups]
# Pillow is only imported by tests to generate synthetic frames.
dev = ["Pillow>=10.0"]

[tool.uv.sources]
videos = { workspace = true }

[tool.coverage.run]
# bare `--cov` traces the editable `videos` workspace dependency; those
# modules are covered by videos' own suite, so measure only this package's
# code.
source = ["src", "tests"]

[tool.deptry]
known_first_party = ["videos_linter"]
# Pillow's importable module is PIL; without the map deptry cannot attribute
# the tests' `from PIL import ...` usage to the Pillow dev dependency.
package_module_name_map = {videos-linter = "videos_linter", Pillow = "PIL"}

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rfEs --tb=short --show-capture=no --import-mode=importlib"
console_output_style = "classic"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingParameterType = true
reportMissingReturnType = true
reportUnnecessaryCast = true
reportUnusedIgnoreComment = true
reportMissingImports = false
