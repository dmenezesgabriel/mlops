# Iceberg catalog backed by the same moto (S3 + Glue) as the hive catalog.
# Athena registers Iceberg tables in Glue with Parameters.table_type=ICEBERG
# and routes statements touching them to its Iceberg engine; the emulator
# mirrors that by qualifying iceberg-bound references with this catalog.
# Metastore: Glue API at moto (trino.io object-storage/metastores.html
# "Iceberg-specific Glue catalog configuration properties").
# Data plane: Trino native S3 client at moto (object-storage/file-system-s3.html).
connector.name=iceberg
iceberg.catalog.type=glue
hive.metastore.glue.region=us-east-1
hive.metastore.glue.endpoint-url=http://moto:5000
hive.metastore.glue.aws-access-key=test
hive.metastore.glue.aws-secret-key=test
# Athena creates Iceberg v2 tables (AWS UG "Create Iceberg tables"); Trino
# defaults to 2 as well — pinned so the semantic survives a Trino bump.
iceberg.format-version=2
fs.s3.enabled=true
s3.endpoint=http://moto:5000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=test
s3.aws-secret-key=test
