# Hive catalog backed by moto (S3 + Glue) per ADR-0005/ADR-0006.
# Metastore: Glue API at moto (trino.io object-storage/metastores.html).
# Data plane: Trino native S3 client at moto (trino.io object-storage/file-system-s3.html).
connector.name=hive
hive.metastore=glue
hive.metastore.glue.region=us-east-1
hive.metastore.glue.endpoint-url=http://moto:5000
hive.metastore.glue.aws-access-key=test
hive.metastore.glue.aws-secret-key=test
# Athena CTAS always writes to an external_location; Trino disables writes
# to non-managed tables by default (connector/hive.html property table).
hive.non-managed-table-writes-enabled=true
# moto Glue implements no column-statistics API (research_repos/moto glue/
# has no statistics surface); Trino's on-write stats calls would fail CTAS.
hive.collect-column-statistics-on-write=false
fs.s3.enabled=true
s3.endpoint=http://moto:5000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=test
s3.aws-secret-key=test