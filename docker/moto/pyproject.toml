[project]
name = "athena-moto-glue-overlay"
version = "0.1.0"
description = "Runtime bridge for the moto Glue operations the Trino hive connector requires."
requires-python = ">=3.11"
dependencies = ["moto[server]==5.1.16"]

[dependency-groups]
dev = ["boto3==1.42.82", "pytest==9.0.3", "pytest-cov==7.1.0"]

[tool.deptry.package_module_name_map]
athena-moto-glue-overlay = "glue_overlay"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glue_overlay.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rfEs --tb=short --show-capture=no --import-mode=importlib"
console_output_style = "classic"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingParameterType = true
reportMissingReturnType = true
reportUnnecessaryCast = true
reportUnusedIgnoreComment = true
reportMissingImports = false